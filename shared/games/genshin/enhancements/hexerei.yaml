# Kit enhancement — see shared/games/README.md for the format.
# Edited by hand; loaded into the database at server start and after each sync.
id: hexerei
name: 'Hexerei: Secret Rite'
version: '6.2'
kind: addition
color: violet
description: >-
  Extra effects gained by Hexerei characters (Genshin 6.2 / Luna III). Shown under the talent or constellation
  they enhance.
entries:
- character: Venti
  target: talent.combat1
  text: >-
    While Stormseye is active, Venti's Normal and Charged Attacks are infused with Anemo DMG. This infusion
    cannot be overridden by other elemental infusions.
- character: Venti
  target: talent.combat3
  text: >-
    Wind's Grand Ode deals 135% increased DMG. The Stormeye is now summoned at the location of the targeted
    opponent.
- character: Klee
  target: talent.combat1
  text: >-
    Klee's Normal Attack combo no longer resets. When the 3rd Normal Attack in the sequence is used, it
    consumes an Explosive Spark and triggers a Coordinated Charged Attack, dealing bonus Pyro DMG.
- character: Albedo
  target: talent.combat2
  text: >-
    Abiogenesis: Solar Isotoma additionally creates Silver Isotomas that also generate Transient Blossoms.
    All nearby party members' DMG is increased based on Albedo's DEF. Hexerei party members receive an
    even greater DMG bonus.
- character: Mona
  target: talent.combat1
  text: >-
    Normal and Charged Attacks that hit opponents afflicted by Omen extend the Omen's remaining duration.
- character: Mona
  target: talent.combat3
  text: >-
    Attacks against opponents afflicted by Omen build up Astral Glow stacks. Each stack increases Vaporize
    reaction DMG dealt by all party members by 5%, up to a maximum of 5 stacks (25%).
- character: Fischl
  target: talent.passive1
  text: >-
    While Oz is on the field, triggering Overloaded increases all party members' ATK by 22.5% for 10s.
    Triggering Electro-Charged increases all party members' Elemental Mastery by 90 for 10s.
- character: Razor
  target: talent.combat3
  text: >-
    Lightning Fang additionally deals AoE Electro DMG equal to 70% of Razor's ATK. While Lightning Fang
    is active, Razor periodically calls down additional lightning strikes on nearby opponents.
- character: Sucrose
  target: talent.combat2
  text: >-
    After Forbidden Creation — Isomer 75 / Type II is created, all party members' Normal Attack, Charged
    Attack, Plunging Attack, Elemental Skill, and Elemental Burst DMG is increased for 15s. Hexerei party
    members receive an enhanced bonus.
- character: Durin
  target: talent.passive1
  text: >-
    All effects of Light Manifest of the Divine Calculus (except its Duration) are increased by 75%.
- character: Venti
  target: constellation.c1
  text: >-
    2 extra arrows that track opponents will be fired per Windsunder Arrow, each dealing 20% of the original
    arrow's DMG. This effect can be triggered once every 0.25s.
- character: Venti
  target: constellation.c2
  text: >-
    Skyward Sonnet's Anemo and Physical RES reduction is increased to 24% for 10s. After unleashing Wind's
    Grand Ode, Venti gains the Wherever a Breeze Blows effect and the cooldown for Skyward Sonnet is reset.
    After a Windsunder Arrow hits an opponent, there is also a 25% chance for Venti to gain the Wherever
    a Breeze Blows effect.
- character: Venti
  target: constellation.c4
  text: >-
    After unleashing Skyward Sonnet or Wind's Grand Ode, Venti and his own active party members gain a
    25% Anemo DMG Bonus for 10s.
- character: Venti
  target: constellation.c6
  text: >-
    The DMG Venti deals to affected opponents gains a CRIT DMG Bonus of 100%.
- character: Klee
  target: constellation.c1
  text: >-
    For 12s after triggering the above effect, Klee's ATK is increased by 60%.
- character: Klee
  target: constellation.c2
  text: >-
    When Klee's Elemental Skill hits an opponent, that opponent's DEF will be decreased by 23% for 10s.
- character: Klee
  target: constellation.c4
  text: >-
    The explosion also triggers when Sparks 'n' Splash ends. If Klee is on-field when the explosion occurs,
    its DMG will be increased by 100%.
- character: Klee
  target: constellation.c6
  text: >-
    Klee also gains a 50% Pyro DMG Bonus for 25s after using Sparks 'n' Splash. When Klee uses an Explosive
    Spark, there is a 50% chance it will not be consumed. While Sparks 'n' Splash is active, Klee's Normal
    Attacks have a 40% chance on the first and second hits to consume an Explosive Spark, dealing an additional
    attack equivalent to Boom-Boom Strike to her opponent(s).
- character: Albedo
  target: constellation.c1
  text: >-
    Using Abiogenesis: Solar Isotoma increases Albedo's DEF by 50% for the next 20s.
- character: Albedo
  target: constellation.c2
  text: >-
    When Albedo is not on the field and Fatal Reckoning reaches 4 stacks, all stacks are consumed and
    3 Fatal Blossoms are generated near the active character, dealing AoE Geo DMG equal to 300% of Albedo's
    DEF.
- character: Albedo
  target: constellation.c4
  text: >-
    When a nearby active party member jumps near a Silver Isotoma, the Silver Isotoma will be destroyed
    while greatly increasing the height of that jump, and for the next 3s, said character will deal 30%
    more Plunging Attack ground impact DMG.
- character: Albedo
  target: constellation.c6
  text: >-
    Use of Rite of Progeniture: Tectonic Tide destroys all Silver Isotomas present on the field. Each
    Silver Isotoma destroyed this way is treated as clearing 4 stacks of Fatal Reckoning.
- character: Mona
  target: constellation.c1
  text: >-
    When your off-field party members trigger the above effect, the DMG Bonus to the above Hydro-related
    Elemental Reactions is enhanced to 160% of its original effect.
- character: Mona
  target: constellation.c2
  text: >-
    Within 5s after Mona unleashes her Elemental Burst Stellaris Phantasm, her next Normal Attack that
    hits an enemy will automatically trigger a Charged Attack. The aforementioned Charged Attack effect
    can only occur once every 5s. When Mona's Charged Attack hits an opponent, all nearby party members
    will have their Elemental Mastery increased by 80 for 12s.
- character: Mona
  target: constellation.c4
  text: >-
    When any Hexerei party member attacks an opponent affected by an Omen, their CRIT DMG is increased
    by 15%.
- character: Mona
  target: constellation.c6
  text: >-
    While Mona is the active character, while she is in the Illusory Torrent state or there are opponents
    affected by an Omen nearby, she gains a 60% increase to the DMG of her next Charged Attack per second
    of movement. A maximum DMG Bonus of 180% can be achieved in this manner. The effect lasts for no more
    than 8s. Additionally, the DMG Mona's Charged Attacks deal to opponents affected by an Omen will be
    increased to 200% of the original DMG.
- character: Fischl
  target: constellation.c6
  text: >-
    After Oz performs a coordinated attack, the ATK and Elemental Mastery bonuses from Witch's Eve Rite:
    Phantasmal Nocturne are further increased by 100% for 10s.
- character: Razor
  target: constellation.c6
  text: >-
    When Razor gains Electro Sigils through Claw and Thunder, he will gain 3 Sigils instead. For 15s after
    consuming Electro Sigils, Razor's CRIT Rate is increased by 10% and CRIT DMG by 50%.
- character: Sucrose
  target: constellation.c6
  text: >-
    Nearby Hexerei characters in the party gain an additional 8.57142% Elemental DMG Bonus for the corresponding
    absorbed element during the skill's duration.
